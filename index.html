<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showroom Día de la madre | Natura & Avon</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Fuentes de Marca -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            pink: '#E04886',        /* Rosa principal Día de la Madre */
                            pinkHover: '#C83270',
                            pinkLight: '#FDF2F7',
                            gray: '#F8FAF9',
                        },
                        avon: {
                            primary: '#E2197C',
                            light: '#FCE7F3'
                        },
                        text: {
                            main: '#2D3748',
                            sec: '#64748B',
                            mut: '#9CA3AF'
                        },
                        ui: {
                            app: '#FFFDFE',
                            card: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['NaturaAndCo', 'Montserrat', 'Inter', 'sans-serif']
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(224, 72, 134, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.03)'
                    }
                }
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'NaturaAndCo';
            src: local('NaturaAndCo'), local('Montserrat');
            font-display: swap;
        }

        ::-webkit-scrollbar { height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #F472B6; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #E04886; }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out both;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .snap-x { scroll-snap-type: x mandatory; }
        .snap-start { scroll-snap-align: start; }
    </style>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TTCKV8TKXL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TTCKV8TKXL');
    </script>
</head>

<body class="bg-ui-app text-text-main font-sans antialiased min-h-screen flex flex-col">

    <!-- Header & Filtros -->
    <header class="bg-white border-b border-pink-100 shadow-soft sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 relative">
            
            <!-- Título y Marca -->
            <div class="flex-1 w-full">
                <div class="flex items-center gap-3">
                    <div id="brand-logo-container" class="transition-all duration-300">
                         <span class="text-2xl font-bold tracking-tight text-brand-pink" id="brand-title">Natura</span>
                    </div>
                    <div class="h-6 w-px bg-pink-200"></div>
                    <h1 class="text-xl font-semibold text-text-main">Showroom Día de la madre 🌸</h1>
                </div>
                <p class="text-text-sec text-[11px] mt-1.5 flex items-center gap-1.5 font-medium tracking-wider uppercase">
                    <i data-lucide="clock" class="w-3.5 h-3.5 stroke-[2.5] text-brand-pink"></i> Actualizado: <span id="last-update" class="text-text-mut whitespace-nowrap">Calculando...</span>
                </p>
            </div>
            
            <!-- Filtros: Gerencia y Buscador -->
            <div class="w-full lg:w-auto flex flex-col sm:flex-row items-center gap-3">
                
                <!-- Buscador por Código o Nombre -->
                <div class="w-full sm:w-64">
                    <label for="search-input" class="block text-[10px] font-bold uppercase tracking-widest text-text-sec mb-1 pl-1">
                        Buscar por Cód / Producto
                    </label>
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="Ej: 12345 o Perfume..." 
                               class="w-full bg-brand-gray border border-pink-200 rounded-xl pl-10 pr-4 py-2.5 text-sm font-medium text-text-main focus:outline-none focus:border-brand-pink focus:ring-2 focus:ring-brand-pink/20 transition-all">
                        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-brand-pink pointer-events-none stroke-[2.5]"></i>
                    </div>
                </div>

                <!-- Selector Gerencia -->
                <div class="w-full sm:w-64">
                    <label for="gerencia-select" class="block text-[10px] font-bold uppercase tracking-widest text-text-sec mb-1 pl-1">
                        Gerencia de Ventas
                    </label>
                    <div class="relative">
                        <select id="gerencia-select" class="w-full appearance-none bg-brand-gray border border-pink-200 rounded-xl px-4 py-2.5 text-sm font-semibold text-text-main focus:outline-none focus:border-brand-pink focus:ring-2 focus:ring-brand-pink/20 transition-all cursor-pointer">
                            <option value="">Cargando gerencias...</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-brand-pink pointer-events-none stroke-[2.5]"></i>
                    </div>
                </div>

            </div>
        </div>
        
        <!-- Navigation Tabs -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex gap-8">
            <button onclick="setTab('Natura')" id="tab-natura" class="py-3 px-1 text-sm font-bold uppercase tracking-widest text-brand-pink border-b-[3px] border-brand-pink transition-all duration-300">Natura</button>
            <button onclick="setTab('Avon')" id="tab-avon" class="py-3 px-1 text-sm font-bold uppercase tracking-widest text-text-mut border-b-[3px] border-transparent hover:text-avon-primary transition-all duration-300">Avon</button>
        </div>
    </header>

    <!-- App Main -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-8">
        
        <!-- Loading State -->
        <div id="loading" class="flex flex-col justify-center items-center py-20">
            <div id="spinner" class="animate-spin rounded-full h-12 w-12 border-[3px] border-pink-100 border-t-brand-pink"></div>
            <p class="mt-5 text-brand-pink font-bold tracking-widest text-[10px] uppercase animate-pulse">Sincronizando Planes Día de la Madre...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex-col justify-center items-center py-24 text-center">
            <div class="bg-white p-6 rounded-3xl shadow-soft border border-pink-100 mb-5">
                <i data-lucide="search-x" class="w-12 h-12 text-brand-pink/50 stroke-[1.5]"></i>
            </div>
            <h3 class="text-xl font-bold text-text-main mb-2 tracking-tight">Sin resultados</h3>
            <p class="text-text-sec text-sm leading-relaxed max-w-md">No encontramos productos para esta búsqueda. Probá cambiando la palabra clave o limpiando el filtro.</p>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden"></div>

    </main>

    <footer class="bg-white border-t border-pink-100 py-8 text-center px-4">
        <p class="text-[10px] font-bold uppercase tracking-[0.3em] text-text-mut">
            &copy; <span id="year"></span> Natura &Co <span class="mx-2 opacity-30">|</span> Bien Estar Bien
        </p>
    </footer>

    <script>
        let db = {
            site: [],
            gerencias: [],
            cuotas: {}
        };
        
        let state = {
            tab: 'Natura',
            gerenciaId: '',
            searchQuery: ''
        };

        async function init() {
            try {
                // Sello anti-caché
                const response = await fetch('./data.json?v=' + Date.now());
                if (!response.ok) throw new Error('No se encontró el archivo de datos');
                
                const data = await response.json();
                
                db.site = data.site || [];
                db.gerencias = data.gerencias || [];
                db.cuotas = data.cuotas || {};

                updateLastUpdate(data.updatedAt);
                populateGerencias();
                setupSearch();
                
                document.getElementById('loading').classList.add('hidden');
                render();

            } catch (err) {
                console.error(err);
                Swal.fire({
                    title: 'Sincronización pendiente',
                    text: 'Aún no se han sincronizado los datos desde la planilla original.',
                    icon: 'info',
                    confirmButtonColor: '#E04886',
                    customClass: { popup: 'rounded-3xl' }
                });
            }
        }

        function populateGerencias() {
            const sel = document.getElementById('gerencia-select');
            sel.innerHTML = '<option value="">Todas las Gerencias (Ver catálogo)</option>';
            db.gerencias.sort((a,b) => a.name.localeCompare(b.name)).forEach(g => {
                const opt = document.createElement('option');
                opt.value = g.id;
                opt.textContent = g.name;
                sel.appendChild(opt);
            });
            sel.onchange = e => { state.gerenciaId = e.target.value; render(); };
        }

        function setupSearch() {
            const input = document.getElementById('search-input');
            input.oninput = e => {
                state.searchQuery = e.target.value.toLowerCase().trim();
                render();
            };
        }

        function setTab(t) {
            state.tab = t;
            const isNatura = t === 'Natura';
            
            const btnN = document.getElementById('tab-natura');
            const btnA = document.getElementById('tab-avon');
            const title = document.getElementById('brand-title');
            
            if(isNatura) {
                btnN.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-brand-pink border-b-[3px] border-brand-pink transition-all duration-300";
                btnA.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-text-mut border-b-[3px] border-transparent hover:text-avon-primary transition-all duration-300";
                title.textContent = "Natura";
                title.className = "text-2xl font-bold tracking-tight text-brand-pink";
            } else {
                btnA.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-avon-primary border-b-[3px] border-avon-primary transition-all duration-300";
                btnN.className = "py-3 px-1 text-sm font-bold uppercase tracking-widest text-text-mut border-b-[3px] border-transparent hover:text-brand-pink transition-all duration-300";
                title.textContent = "Avon";
                title.className = "text-2xl font-bold tracking-tight text-avon-primary";
            }
            render();
        }

        function getImg(marca, cod, type) {
            const folder = type === 'A' ? marca.trim() : 'Alternativas';
            return `./imagenes/${folder}/${cod}.jpg`;
        }

        async function shareImage(url, cod, desc) {
            const fileName = `${cod}_${desc.replace(/[^a-z0-9]/gi, '_')}.jpg`;
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            
            try {
                if (isMobile && navigator.canShare && navigator.share) {
                    const response = await fetch(url);
                    const blob = await response.blob();
                    const file = new File([blob], fileName, { type: "image/jpeg" });

                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            files: [file],
                            title: desc,
                            text: `Mirá este regalo para Mamá: ${desc} (Cód: ${cod})`
                        });
                        return;
                    }
                }
                
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch (err) {
                console.error('Error en la accion:', err);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                a.click();
            }
        }

        function render() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const grid = document.getElementById('product-grid');
            const empty = document.getElementById('empty-state');
            grid.innerHTML = '';

            // 1. Filtrar por Marca
            let filtered = db.site.filter(i => i.marca.trim().toLowerCase() === state.tab.trim().toLowerCase());

            // 2. Filtrar por Buscador (Código o Nombre)
            if (state.searchQuery) {
                const q = state.searchQuery;
                filtered = filtered.map(item => {
                    const matchingPlans = item.plans.filter(p => 
                        p.cod.toString().toLowerCase().includes(q) || 
                        p.desc.toLowerCase().includes(q)
                    );
                    return matchingPlans.length > 0 ? { ...item, plans: matchingPlans } : null;
                }).filter(Boolean);
            }

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                empty.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                empty.classList.add('hidden');
                empty.classList.remove('flex');

                filtered.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = "animate-fade-in bg-white rounded-2xl border border-pink-100 shadow-soft hover:-translate-y-1 transition-all duration-300 flex flex-col overflow-hidden";
                    card.style.animationDelay = `${idx * 0.05}s`;

                    const carousel = document.createElement('div');
                    carousel.className = "flex overflow-x-auto snap-x";
                    
                    item.plans.forEach(plan => {
                        const slide = document.createElement('div');
                        slide.className = "min-w-full snap-start p-5 flex flex-col";
                        
                        const isMain = plan.type === 'A';
                        const badgeColor = isMain ? (state.tab === 'Natura' ? 'bg-brand-pink' : 'bg-avon-primary') : 'bg-gray-800';
                        
                        // Detalle de Cuotas por Gerencia
                        let quotaHTML = "";
                        if (state.gerenciaId) {
                            const stock = db.cuotas[state.gerenciaId]?.[plan.cod];
                            if (stock !== undefined) {
                                if (stock > 0) {
                                    quotaHTML = `
                                        <div class="flex items-center gap-1.5 text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">
                                            <i data-lucide="check-circle-2" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                                            <span class="text-[11px] font-bold">Cuota disponible: ${stock} un.</span>
                                        </div>`;
                                } else {
                                    quotaHTML = `
                                        <div class="flex items-center gap-1.5 text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200">
                                            <i data-lucide="x-circle" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                                            <span class="text-[11px] font-extrabold uppercase">Sin cuota disponible</span>
                                        </div>`;
                                }
                            } else {
                                quotaHTML = `
                                    <div class="flex items-center gap-1.5 text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg border border-emerald-200">
                                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                                        <span class="text-[11px] font-bold">CON CUOTA</span>
                                    </div>`;
                            }
                        } else {
                            quotaHTML = `
                                <span class="text-[10px] text-text-mut font-medium italic flex items-center gap-1">
                                    <i data-lucide="info" class="w-3 h-3 text-brand-pink"></i> Elegí Gerencia para ver cuota
                                </span>`;
                        }

                        const actionIcon = isMobile ? 'share-2' : 'download';
                        const imgPath = getImg(item.marca, plan.cod, plan.type);
                        const safeDesc = plan.desc.replace(/'/g, "\\'");
                        
                        slide.innerHTML = `
                            <div class="relative mb-4">
                                ${!isMain ? `
                                    <span class="absolute top-2 left-2 z-10 ${badgeColor} text-white text-[9px] font-bold px-3 py-1.5 rounded-lg uppercase tracking-widest shadow-sm">
                                        Alternativa ${plan.type}
                                    </span>
                                ` : ''}

                                <button onclick="shareImage('${imgPath}', '${plan.cod}', '${safeDesc}')" 
                                   title="${isMobile ? 'Compartir' : 'Descargar'}"
                                   class="absolute top-2 right-2 z-20 w-8 h-8 flex items-center justify-center bg-white/90 backdrop-blur-sm rounded-full text-brand-pink shadow-sm hover:bg-brand-pink hover:text-white transition-all cursor-pointer border border-pink-100">
                                    <i data-lucide="${actionIcon}" class="w-4 h-4"></i>
                                </button>

                                <div class="aspect-square bg-brand-gray rounded-xl flex items-center justify-center p-6 border border-pink-50/60">
                                    <img src="${imgPath}" 
                                         onerror="this.src='https://placehold.co/400x400/FFF5F8/E04886?text=Próximamente'" 
                                         class="max-w-full max-h-full object-contain mix-blend-multiply">
                                </div>
                            </div>
                            <div class="flex-1 flex flex-col">
                                <span class="text-[10px] text-brand-pink font-bold tracking-widest uppercase mb-1">Cód: ${plan.cod}</span>
                                <h4 class="text-sm font-bold text-text-main leading-tight mb-4 flex-1 line-clamp-2">${plan.desc}</h4>
                                <div class="pt-3 border-t border-pink-100/60 flex items-center justify-between">
                                    ${quotaHTML}
                                </div>
                            </div>
                        `;
                        carousel.appendChild(slide);
                    });

                    card.appendChild(carousel);
                    if (item.plans.length > 1) {
                        const info = document.createElement('div');
                        info.className = "px-5 pb-4 text-[9px] font-bold uppercase tracking-[0.2em] text-brand-pink flex items-center gap-2";
                        info.innerHTML = `<i data-lucide="arrow-left-right" class="w-3"></i> Desliza para ver alternativas`;
                        card.appendChild(info);
                    }
                    grid.appendChild(card);
                });
            }
            lucide.createIcons();
            document.getElementById('year').textContent = new Date().getFullYear();
        }

        function updateLastUpdate(isoDate) {
            const d = isoDate ? new Date(isoDate) : new Date();
            const fmt = `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
            document.getElementById('last-update').textContent = fmt;
        }

        window.onload = init;
    </script>
</body>
</html>
